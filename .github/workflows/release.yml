name: Release

# v1.2.3 形式のタグを push すると、Windows / macOS / Linux の配布物をビルドして
# GitHub Releases に公開する。手動実行（workflow_dispatch）の場合は下書きリリースになる。
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'バージョン番号（例: 1.0.0）'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::バージョンは 1.2.3 の形式で指定してください（MSI の制約）: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: NSIS インストーラー (.exe) + MSI + ポータブルzip
          - os: windows-latest
            label: windows-x64
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
          # macOS: Universal Binary（Apple Silicon + Intel）の .dmg + .app.zip
          - os: macos-latest
            label: macos-universal
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          # Linux: .AppImage（依存ライブラリ同梱）+ .deb
          # 古めの glibc でビルドして、より多くのディストリで動くようにする
          - os: ubuntu-22.04
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: appimage,deb

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.label }}

      - run: npm ci

      - name: Set version
        run: node scripts/set-version.mjs ${{ needs.prepare.outputs.version }}

      - name: Generate third-party license notices
        run: node scripts/generate-third-party-licenses.mjs

      # Apple の証明書が Secrets にある場合のみ署名・公証する（無ければ ad-hoc 署名）
      - name: Configure Apple code signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE" ]]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            echo "Developer ID で署名します"
          else
            echo "::notice::Apple 証明書が未設定のため ad-hoc 署名でビルドします（初回起動時に右クリック→開く が必要）"
          fi
          if [[ -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "公証（notarization）を行います"
          fi

      - name: Build
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect artifacts
        run: node scripts/collect-artifacts.mjs --target ${{ matrix.target }} --label ${{ matrix.label }}

      - uses: actions/upload-artifact@v4
        with:
          name: clicksync-${{ matrix.label }}
          path: release/*
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ClickSync ${{ needs.prepare.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: release/*
          body: |
            ## ダウンロード

            | OS | ファイル | 備考 |
            |---|---|---|
            | Windows 10/11 (64bit) | `ClickSync_${{ needs.prepare.outputs.version }}_windows-x64-setup.exe` | おすすめ。ダブルクリックでインストール |
            | Windows 10/11 (64bit) | `ClickSync_${{ needs.prepare.outputs.version }}_windows-x64.msi` | 企業内配布向け |
            | Windows 10/11 (64bit) | `ClickSync_${{ needs.prepare.outputs.version }}_windows-x64-portable.zip` | インストール不要。展開して `ClickSync.exe` を起動 |
            | macOS 10.15+ (Apple Silicon / Intel) | `ClickSync_${{ needs.prepare.outputs.version }}_macos-universal.dmg` | 開いて Applications へドラッグ |
            | Linux (x86_64) | `ClickSync_${{ needs.prepare.outputs.version }}_linux-x86_64.AppImage` | 実行権限を付けてダブルクリック |
            | Ubuntu / Debian | `ClickSync_${{ needs.prepare.outputs.version }}_linux-x86_64.deb` | ダブルクリックでインストール |

            ## はじめかた
            1. アプリを起動し、⚙ 設定で **Gemini APIキー** を入力（[取得はこちら](https://aistudio.google.com/app/apikey)）
            2. 必要なら見本画像（デザイン見本のサムネイル）を設定
            3. 動画の音声ファイル・字幕ファイル・台本のいずれかを読み込んで「🚀 生成」
